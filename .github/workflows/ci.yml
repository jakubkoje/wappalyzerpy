name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync project environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check src tests main.py

      - name: Run Ty
        run: uv run ty check src tests main.py
