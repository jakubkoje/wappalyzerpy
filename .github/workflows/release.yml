name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/wappalyzer_pure/data/fingerprints/**"
      - "src/wappalyzer_pure/data/categories/**"
      - "src/wappalyzer_pure/data/antibot/anti_bot_technologies_data.json"
      - "src/wappalyzer_pure/data/antibot/anti_bot_aliases_data.json"
      - ".github/data/source_metadata.json"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync project environment
        run: uv sync --frozen

      - name: Read version
        id: version
        run: echo "value=$(uv run python -m wappalyzer_pure.versioning --print-version)" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.tag.outputs.exists == 'false'
        run: |
          python - <<'PY' > release-notes.txt
          import json
          from pathlib import Path

          metadata_path = Path(".github/data/source_metadata.json")
          if metadata_path.exists():
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          else:
              metadata = {"sources": {}, "comparison": {}}

          sources = metadata.get("sources", {})
          comparison = metadata.get("comparison", {})
          print("Automated data release for wappalyzer-pure.")
          print()
          for name in ("merged", "enthec", "httparchive"):
              source = sources.get(name, {})
              counts = source.get("counts", {})
              print(f"- Source: {name}")
              if name == "merged":
                  print(
                      f"  Generated from: "
                      f"{', '.join(source.get('generated_from', [])) or 'unknown'}"
                  )
              else:
                  print(f"  Repo: {source.get('repo') or 'unknown'}")
                  print(f"  Ref: {source.get('ref') or 'unknown'}")
                  print(f"  Commit: {source.get('commit') or 'unknown'}")
              print(f"  Synced at: {source.get('fetched_at_utc') or 'unknown'}")
              print(f"  Technologies: {counts.get('technologies', 'unknown')}")
              print(f"  Categories: {counts.get('categories', 'unknown')}")
          anti_bot = metadata.get("anti_bot_technologies", {})
          aliases = metadata.get("anti_bot_aliases", {})
          if anti_bot or aliases:
              print()
              print("- Anti-bot derived data")
              print(
                  f"  Technology entries: "
                  f"{anti_bot.get('count', 'unknown')}"
              )
              print(
                  f"  Derived from: "
                  f"{anti_bot.get('derived_from', 'unknown')}"
              )
              print(
                  f"  Vendor aliases: "
                  f"{aliases.get('vendor_aliases', 'unknown')}"
              )
              print(
                  f"  Product aliases: "
                  f"{aliases.get('product_aliases', 'unknown')}"
              )
          technology_comparison = comparison.get("technologies", {})
          if technology_comparison:
              print()
              print("- Technology comparison")
              print(f"  Shared: {technology_comparison.get('shared', 'unknown')}")
              print(
                  f"  Only enthec: "
                  f"{technology_comparison.get('only_enthec', 'unknown')}"
              )
              print(
                  f"  Only httparchive: "
                  f"{technology_comparison.get('only_httparchive', 'unknown')}"
              )
              print(
                  f"  Identical shared: "
                  f"{technology_comparison.get('identical_shared', 'unknown')}"
              )
              print(
                  f"  Different shared: "
                  f"{technology_comparison.get('different_shared', 'unknown')}"
              )
          PY

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ steps.version.outputs.value }}" \
            --target "${GITHUB_SHA}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file release-notes.txt
